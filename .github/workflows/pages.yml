name: Deploy no GitHub Pages

# A landing é HTML puro, sem build: a Action só empacota os arquivos e
# publica. A cada push na main, redeploya sozinha.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          # a raiz do repo é o site (index.html + estilos.css)
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
